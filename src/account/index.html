<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComputerCrafter | Account</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/account.js" ></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="account divider">
        <h1>Your Account</h1>
        <section class="account-info">
            <h2>Account Information</h2>
            <p><strong>Name:</strong> <span id="name"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Address:</strong> <span id="address"></span></p>
        </section>
        <section id="orders" class="order-history hide">
            <a href="../orders/index.html"><button id="viewOrdersButton">View Order History</button></a>
        </section>
        <button id="logoutButton">Logout</button>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
